<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nə? Harada? Nə zaman?</title>
<style>
:root {
  --bg: #ffffff; --fg: #0a0a0a; --muted: #737373; --card: #f5f5f5; --border: #e5e5e5;
  --primary: #171717; --primary-fg: #fafafa; --good: #16a34a; --bad: #dc2626; --warn: #d97706;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --card: #171717; --border: #262626;
    --primary: #fafafa; --primary-fg: #171717; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --card: #171717; --border: #262626;
  --primary: #fafafa; --primary-fg: #171717; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; }
header { position: sticky; top: 0; z-index: 3; margin: -16px -16px 0; padding: 12px 16px 0; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
.bar { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.bar strong { color: var(--fg); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); color: var(--fg); font-size: 14px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill .label { color: var(--muted); font-weight: 500; }
.name-pill { min-width: 0; flex: 0 1 auto; }
.name-pill span { overflow: hidden; text-overflow: ellipsis; }
.name-pill svg { flex: none; opacity: .6; }
.spacer { flex: 1; }
.time-track { height: 4px; margin: 0 -16px; background: var(--card); }
.time-fill { height: 100%; width: 100%; background: var(--primary); transform-origin: left; transition: transform .2s linear, background-color .3s; }
.time-fill.low { background: var(--warn); }
.dock { position: sticky; bottom: 0; z-index: 3; margin: auto -16px calc(-24px - env(safe-area-inset-bottom)); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg) 16px); }
.skip { width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--card); color: var(--fg); border: 1px solid var(--border); text-align: left; transition: background-color .2s, border-color .2s, transform .1s; -webkit-tap-highlight-color: transparent; }
.skip:active { transform: scale(.98); }
.skip:disabled { opacity: 1; cursor: default; transform: none; }
.skip:disabled .skip-title { color: var(--muted); }
.skip-main { display: flex; align-items: center; gap: 12px; }
.skip-icon { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--border); }
.skip-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.skip-title { font-size: 16px; font-weight: 700; }
.skip-hint { font-size: 13px; font-weight: 500; color: var(--muted); }
.skip-count { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.skip-segments { display: flex; gap: 4px; height: 6px; }
.skip-segments i { flex: 1; border-radius: 3px; background: var(--border); transition: background-color .25s; }
.skip-segments i.on { background: var(--good); }
.skip.on { border-color: color-mix(in srgb, var(--good) 55%, transparent); background: color-mix(in srgb, var(--good) 12%, var(--card)); }
.skip.on .skip-icon { background: var(--good); border-color: var(--good); color: var(--bg); }
.skip.on .skip-count { color: var(--good); }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
h1 { font-size: 24px; line-height: 1.25; margin: 0; }
.muted { color: var(--muted); }
.big-number { font-size: 120px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.question { font-size: 20px; line-height: 1.45; font-weight: 500; white-space: pre-line; margin: 0; }
.note { border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.handout { width: 100%; border-radius: 10px; border: 1px solid var(--border); }
.pre { white-space: pre-line; }
.card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
form { display: flex; flex-direction: column; gap: 10px; }
input { font: inherit; font-size: 18px; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
button { font: inherit; font-weight: 600; padding: 12px 16px; border-radius: 10px; border: 0; background: var(--primary); color: var(--primary-fg); cursor: pointer; }
button:disabled { opacity: .5; }
.error { color: var(--bad); font-size: 14px; min-height: 1.5em; margin: 0; }
.link { background: none; color: inherit; padding: 0; font-weight: inherit; text-decoration: underline dotted; text-underline-offset: 3px; border-radius: 0; }
.ghost { display: inline-flex; align-items: center; gap: 6px; background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
.banner { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--warn); color: #000; z-index: 5; box-shadow: 0 4px 16px rgb(0 0 0 / .25); }
.banner[hidden] { display: none; }
.dot-pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay .card { background: var(--bg); width: 100%; max-width: 420px; }
.row { display: flex; gap: 8px; }
.row button { flex: 1; }
.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 12px 12px 14px; border-radius: 14px; background: var(--primary); color: var(--primary-fg); }
.notice.is-new { animation: drop .25s ease-out; }
.notice[hidden] { display: none; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } }
.notice-icon { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--primary-fg) 14%, transparent); }
.notice-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.notice-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
.notice-text { font-size: 17px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.notice-close { flex: none; width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-radius: 50%; background: transparent; color: inherit; opacity: .7; }
.danger { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); }
.sheet-overlay { align-items: flex-end; padding: 0; }
.sheet { max-width: 640px !important; border-radius: 20px 20px 0 0; border-bottom: 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); gap: 16px; animation: rise .2s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-title { font-size: 20px; }
.sheet-section { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border); }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.icon-button { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border-radius: 50%; background: var(--card); color: var(--fg); border: 1px solid var(--border); }
.sent { display: flex; align-items: center; gap: 6px; color: var(--good); font-size: 14px; margin: 0; min-height: 1.5em; }
.sent.error-text { color: var(--bad); }
.timer { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fg); min-width: 3ch; text-align: right; }
.timer.low { color: var(--warn); }
.verdict { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; margin: -14px -14px 4px; padding: 14px; border-radius: 12px 12px 0 0; background: var(--card); }
.verdict.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.verdict.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.verdict .points { margin-left: auto; font-size: 20px; }
.answer { font-size: 22px; font-weight: 700; margin: 0; }
ol.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
ol.board li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--card); }
ol.board li.me { outline: 2px solid var(--primary); }
ol.board .rank { width: 28px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
ol.board .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ol.board .score { font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById('app');
const STORAGE_KEY = 'party-player';
let session = readSession();
let events = null;
let state = null;
let deadline = null;
let renderedScreen = null;
let timerElement = null;
let retryTimer = null;
let lastHeardAt = Date.now();
const SILENCE_BEFORE_RECONNECT_MS = 50000;
const banner = el('div', { class: 'banner', hidden: true }, el('span', { class: 'dot-pulse' }), 'Reconnecting…');
document.body.append(banner);

function readSession() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch {
    return null;
  }
}

function saveSession(value) {
  session = value;
  try {
    if (value) localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    else localStorage.removeItem(STORAGE_KEY);
  } catch {}
}

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node[key] = value;
  }
  for (const child of children.flat()) if (child != null && child !== false) node.append(child);
  return node;
}

const withLineBreaks = text => (text ?? '').replaceAll('/-/', '\n');
const clock = ms => {
  const seconds = Math.ceil(ms / 1000);
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
};
const pointsLabel = points => (points > 0 ? `+${points}` : points < 0 ? `−${-points}` : '0');
const rulesText = () => `Correct ${pointsLabel(state.rules.pointsForCorrect)} · Wrong ${pointsLabel(state.rules.pointsForWrong)} · No answer 0`;
const imageUrl = (route) => `${route}?token=${encodeURIComponent(session.token)}&question=${state.index}`;

function show(...children) {
  app.replaceChildren(...children.flat().filter(Boolean));
}

function showJoin(errorText = '', { previousName = session?.name ?? '', note = 'Type your name to join the game.' } = {}) {
  renderedScreen = 'join';
  banner.hidden = true;
  notice.hidden = true;
  const name = el('input', { placeholder: 'Your name', maxLength: 24, autocomplete: 'nickname', required: true, value: previousName });
  const error = el('p', { class: 'error' }, errorText);
  const button = el('button', { type: 'submit' }, 'Join the game');
  const join = async event => {
    event.preventDefault();
    button.disabled = true;
    error.textContent = '';
    try {
      const response = await fetch('/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.value }) });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error);
      saveSession({ token: body.token, partyId: body.partyId, name: name.value.trim() });
      connect();
    } catch (e) {
      error.textContent = e.message || 'Could not join';
      button.disabled = false;
    }
  };
  show(el('div', { class: 'center' },
    el('h1', {}, 'Nə? Harada? Nə zaman?'),
    el('p', { class: 'muted' }, note),
    el('form', { onsubmit: join, style: 'width:100%' }, name, button, error)));
  name.focus();
}

function connect() {
  clearTimeout(retryTimer);
  events?.close();
  lastHeardAt = Date.now();
  events = new EventSource(`/events?token=${encodeURIComponent(session.token)}`);
  events.onopen = () => { banner.hidden = true; };
  events.onmessage = message => {
    lastHeardAt = Date.now();
    banner.hidden = true;
    render(JSON.parse(message.data));
  };
  events.addEventListener('ping', () => { lastHeardAt = Date.now(); });
  events.onerror = () => {
    if (renderedScreen === 'closed' || renderedScreen === 'join') return;
    banner.hidden = false;
    if (events.readyState === EventSource.CLOSED) checkSession();
  };
}

async function checkSession() {
  clearTimeout(retryTimer);
  events?.close();
  if (!session?.token) return showJoin();
  try {
    const response = await fetch(`/me?token=${encodeURIComponent(session.token)}`, { cache: 'no-store' });
    if (response.status === 401) {
      const previousName = session.name;
      saveSession(null);
      return showJoin('', { previousName, note: 'You are no longer in this game. Type your name to join again.' });
    }
    if (response.ok) {
      const body = await response.json();
      saveSession({ ...session, name: body.name });
      return connect();
    }
  } catch {}
  banner.hidden = false;
  retryTimer = setTimeout(checkSession, 3000);
}

function reconnectIfDead() {
  if (!session?.token || renderedScreen === 'closed' || renderedScreen === 'join') return;
  const isSilent = Date.now() - lastHeardAt > SILENCE_BEFORE_RECONNECT_MS;
  if (!events || events.readyState === EventSource.CLOSED || isSilent) checkSession();
}

document.addEventListener('visibilitychange', () => (document.visibilityState === 'hidden' ? reportAway() : cameBack()));
window.addEventListener('online', reconnectIfDead);
window.addEventListener('pageshow', reconnectIfDead);
setInterval(reconnectIfDead, 10000);

function showSettings() {
  document.querySelector('.overlay')?.remove();
  const name = el('input', { placeholder: 'Your name', maxLength: 24, autocomplete: 'nickname', required: true, value: state?.me.name ?? session.name ?? '' });
  const message = el('p', { class: 'sent' });
  const save = el('button', { type: 'submit' }, 'Save name');
  const leave = el('button', { type: 'button', class: 'danger' }, 'Leave the game');
  const overlay = el('div', { class: 'overlay sheet-overlay' });
  const close = () => overlay.remove();
  const showMessage = (text, isError) => {
    message.classList.toggle('error-text', isError);
    message.textContent = text;
  };
  const rename = async event => {
    event.preventDefault();
    save.disabled = true;
    showMessage('', false);
    try {
      const response = await fetch('/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: session.token, name: name.value }) });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error);
      saveSession({ ...session, name: body.name });
      name.value = body.name;
      message.replaceChildren(icon(ICONS.check), 'Name saved');
    } catch (e) {
      showMessage(e.message || 'Could not change the name', true);
    }
    save.disabled = false;
  };
  let isConfirmingLeave = false;
  leave.addEventListener('click', async () => {
    if (!isConfirmingLeave) {
      isConfirmingLeave = true;
      leave.textContent = 'Tap again to leave';
      return;
    }
    leave.disabled = true;
    const token = session.token;
    const previousName = session.name;
    renderedScreen = 'join';
    events?.close();
    saveSession(null);
    try {
      await fetch('/leave', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    } catch {}
    close();
    showJoin('', { previousName, note: 'You left the game. Type your name to join again.' });
  });
  overlay.append(el('div', { class: 'card sheet' },
    el('div', { class: 'sheet-head' },
      el('strong', { class: 'sheet-title' }, 'Settings'),
      el('button', { type: 'button', class: 'icon-button', onclick: close, title: 'Close' }, icon(ICONS.close))),
    el('form', { onsubmit: rename },
      el('label', { class: 'field-label' }, 'Your name'),
      name, save, message),
    el('div', { class: 'sheet-section' },
      el('label', { class: 'field-label' }, 'Leave'),
      el('p', { class: 'muted', style: 'margin:0;font-size:14px' }, 'Leaving removes you and your score from this game. You can join again with any free name.'),
      leave)));
  overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
  document.body.append(overlay);
}

const DISMISSED_KEY = 'party-dismissed-announcement';
const notice = el('div', { class: 'notice', hidden: true, role: 'status' });
let shownAnnouncementId = null;

function dismissedAnnouncementId() {
  try {
    return sessionStorage.getItem(DISMISSED_KEY);
  } catch {
    return null;
  }
}

function dismissAnnouncement() {
  try {
    sessionStorage.setItem(DISMISSED_KEY, shownAnnouncementId);
  } catch {}
  notice.hidden = true;
}

function updateAnnouncement() {
  const announcement = state?.announcement;
  if (!announcement || announcement.id === dismissedAnnouncementId()) {
    notice.hidden = true;
    shownAnnouncementId = null;
    return;
  }
  const header = app.querySelector('header');
  if (header) header.after(notice);
  else app.prepend(notice);
  if (announcement.id === shownAnnouncementId && !notice.hidden) return;
  const isNew = announcement.id !== shownAnnouncementId;
  if (isNew) navigator.vibrate?.([80, 60, 80]);
  notice.classList.toggle('is-new', isNew);
  shownAnnouncementId = announcement.id;
  notice.replaceChildren(
    el('span', { class: 'notice-icon' }, icon(ICONS.megaphone)),
    el('span', { class: 'notice-body' }, el('span', { class: 'notice-label' }, 'From the host'), el('span', { class: 'notice-text' }, announcement.text)),
    el('button', { type: 'button', class: 'notice-close', title: 'Close', onclick: dismissAnnouncement }, icon(ICONS.close)));
  notice.hidden = false;
}

let isAway = false;

function reportAway() {
  if (isAway || !session?.token || state?.phase !== 'question') return;
  isAway = true;
  const body = JSON.stringify({ token: session.token });
  if (!navigator.sendBeacon?.('/away', body)) fetch('/away', { method: 'POST', body, keepalive: true }).catch(() => {});
}

function cameBack() {
  isAway = false;
  reconnectIfDead();
}

window.addEventListener('blur', reportAway);
window.addEventListener('pagehide', reportAway);
window.addEventListener('focus', cameBack);

const icon = path => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', '18');
  svg.setAttribute('height', '18');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2.2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.innerHTML = path;
  return svg;
};
const ICONS = {
  skip: '<path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  settings: '<path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  hourglass: '<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22"/><path d="M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4a2 2 0 0 0 .6-1.4V2"/>',
  megaphone: '<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
};

const nameButton = () => el('button', { type: 'button', class: 'pill name-pill', onclick: showSettings, title: 'Settings' },
  el('span', { id: 'me-name' }, state.me.name), icon(ICONS.settings));
const settingsButton = () => el('button', { type: 'button', class: 'ghost', onclick: showSettings }, icon(ICONS.settings), 'Settings');

async function toggleSkip() {
  try {
    await fetch('/skip', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: session.token }) });
  } catch {}
}

const SKIP_TITLES = { waiting: 'Start the question', question: "I'm done", reveal: 'Next' };
const MAX_SKIP_SEGMENTS = 12;

function skipDock() {
  return el('div', { class: 'dock', id: 'skip-dock' },
    el('button', { type: 'button', class: 'skip', id: 'skip-button', onclick: toggleSkip },
      el('span', { class: 'skip-main' },
        el('span', { class: 'skip-icon', id: 'skip-icon' }),
        el('span', { class: 'skip-text' }, el('span', { class: 'skip-title', id: 'skip-title' }), el('span', { class: 'skip-hint', id: 'skip-hint' })),
        el('span', { class: 'skip-count', id: 'skip-count' })),
      el('span', { class: 'skip-segments', id: 'skip-segments' })));
}

function updateSkip() {
  const dock = document.getElementById('skip-dock');
  if (!dock) return;
  const skip = state.skip;
  dock.hidden = !skip?.isAvailable && !skip?.isHostChecking;
  if (dock.hidden) return;
  const button = document.getElementById('skip-button');
  button.disabled = !skip.isAvailable;
  if (!skip.isAvailable) {
    button.classList.remove('on');
    document.getElementById('skip-icon').replaceChildren(icon(ICONS.hourglass));
    document.getElementById('skip-title').textContent = 'The host is checking answers';
    document.getElementById('skip-hint').textContent = 'Only the host can move on now';
    document.getElementById('skip-count').textContent = '';
    document.getElementById('skip-segments').replaceChildren();
    return;
  }
  const others = skip.of - skip.count;
  button.classList.toggle('on', !!skip.isMine);
  document.getElementById('skip-icon').replaceChildren(icon(skip.isMine ? ICONS.check : ICONS.skip));
  document.getElementById('skip-title').textContent = skip.isMine ? `Waiting for ${others} ${others === 1 ? 'player' : 'players'}` : SKIP_TITLES[state.phase];
  document.getElementById('skip-hint').textContent = skip.isMine ? 'Tap to undo' : 'Moves on when everyone taps';
  document.getElementById('skip-count').textContent = `${skip.count}/${skip.of}`;
  const segmentCount = Math.min(skip.of, MAX_SKIP_SEGMENTS);
  const filled = Math.round((skip.count / Math.max(skip.of, 1)) * segmentCount);
  document.getElementById('skip-segments').replaceChildren(...Array.from({ length: segmentCount }, (_, i) => el('i', { class: i < filled ? 'on' : '' })));
}

function leaderboard(entries) {
  return el('ol', { class: 'board' }, entries.map(entry => el('li', { class: entry.name === state.me.name ? 'me' : '' },
    el('span', { class: 'rank' }, `${entry.rank}.`), el('span', { class: 'name' }, entry.name), el('span', { class: 'score' }, entry.score))));
}

let timeFillElement = null;

function topBar() {
  timerElement = el('span', { class: 'timer' });
  timeFillElement = el('div', { class: 'time-fill' });
  return el('header', {},
    el('div', { class: 'bar' },
      el('span', { class: 'pill' }, el('span', { class: 'label' }, 'Q'), `${state.index + 1}/${state.total}`),
      nameButton(),
      el('span', { class: 'pill' }, el('span', { class: 'label' }, 'Score'), state.me.score),
      el('span', { class: 'spacer' }),
      timerElement),
    el('div', { class: 'time-track' }, timeFillElement));
}

const phaseSeconds = () => ({ waiting: state.rules.secondsBetweenQuestions, question: state.rules.secondsPerQuestion, reveal: state.rules.secondsOnAnswer })[state.phase];

function questionBlock() {
  const question = state.question;
  return [
    question.noteBefore && el('div', { class: 'note' }, question.noteBefore),
    el('p', { class: 'question' }, withLineBreaks(question.text)),
    question.hasHandoutImage && el('img', { class: 'handout', src: imageUrl('/handout'), alt: 'Handout' }),
    question.handoutText && el('p', { class: 'pre' }, question.handoutText),
  ];
}

function answerForm() {
  const input = el('input', { placeholder: 'Your answer', maxLength: 200, autocomplete: 'off', autocapitalize: 'off', spellcheck: false, value: state.myAnswer ?? '' });
  const status = el('p', { class: 'sent', id: 'answer-status' });
  const showError = text => {
    status.classList.add('error-text');
    status.textContent = text;
  };
  const button = el('button', { type: 'submit' }, 'Send answer');
  const send = async event => {
    event.preventDefault();
    button.disabled = true;
    try {
      const response = await fetch('/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: session.token, answer: input.value }) });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error);
      input.blur();
    } catch (e) {
      showError(e.message || 'Could not send');
    }
    button.disabled = false;
  };
  return el('form', { onsubmit: send }, input, button, status);
}

function updateAnswerStatus() {
  const status = document.getElementById('answer-status');
  if (!status || state.myAnswer == null) return;
  status.classList.remove('error-text');
  status.replaceChildren(icon(ICONS.check), `Sent “${state.myAnswer || '—'}”. You can change it until time is up.`);
}

function render(next) {
  renderScreen(next);
  if (renderedScreen === 'join' || renderedScreen === 'closed') notice.hidden = true;
  else updateAnnouncement();
}

function renderScreen(next) {
  state = next;
  if ('isNightMode' in next) document.documentElement.dataset.theme = next.isNightMode ? 'dark' : 'light';
  deadline = next.remainingMs == null || next.isPaused ? null : Date.now() + next.remainingMs;
  if (next.phase === 'kicked') {
    events.close();
    const previousName = session?.name;
    saveSession(null);
    return showJoin('', { previousName, note: 'The host removed you from the game. Type your name to join again.' });
  }
  if (next.phase === 'closed') {
    renderedScreen = 'closed';
    events.close();
    saveSession(null);
    return show(el('div', { class: 'center' },
      el('h1', {}, 'The host closed the game'),
      el('p', { class: 'muted' }, 'Thanks for playing!')));
  }
  if (session && next.me && session.name !== next.me.name) saveSession({ ...session, name: next.me.name });
  const screen = `${next.phase}:${next.index}`;
  if (screen === renderedScreen && next.phase === 'question') {
    const nameElement = document.getElementById('me-name');
    if (nameElement) nameElement.textContent = next.me.name;
    updateSkip();
    return updateAnswerStatus();
  }
  renderedScreen = screen;
  const done = rendered => {
    updateSkip();
    return rendered;
  };
  if (next.phase === 'lobby' && next.round > 0) {
    return show(el('div', { class: 'center', style: 'flex:0;padding-top:24px' },
      el('h1', {}, `Round ${next.round} is over`),
      el('p', { class: 'muted' }, `Your score: ${next.me.score} · place ${next.me.rank} of ${next.playerCount}. Waiting for the next round…`),
      el('div', { style: 'margin-top:8px' }, settingsButton())),
      leaderboard(next.leaderboard));
  }
  if (next.phase === 'lobby') {
    return show(el('div', { class: 'center' },
      el('h1', {}, `You're in, ${next.me.name}!`),
      el('p', { class: 'muted' }, `Waiting for the host to start… ${next.playerCount} ${next.playerCount === 1 ? 'player' : 'players'} joined.`),
      el('div', { style: 'margin-top:8px' }, settingsButton())));
  }
  if (next.phase === 'waiting') {
    return done(show(topBar(), el('div', { class: 'center' },
      el('p', { class: 'muted' }, 'Question'), el('div', { class: 'big-number' }, next.index + 1), el('p', { class: 'muted' }, `of ${next.total}`)), skipDock()));
  }
  if (next.phase === 'question') {
    isAway = false;
    if (document.visibilityState === 'hidden') reportAway();
    show(topBar(), questionBlock(), answerForm(), el('p', { class: 'muted', style: 'margin:0;font-size:14px' }, rulesText()), skipDock());
    updateSkip();
    return updateAnswerStatus();
  }
  if (next.phase === 'judging') {
    return show(topBar(), questionBlock(), el('div', { class: 'card' },
      el('strong', {}, "Time's up! Checking answers…"),
      el('span', { class: 'muted' }, `Your answer: ${next.myAnswer || '—'}`)));
  }
  if (next.phase === 'reveal') {
    const reveal = next.reveal;
    const verdict = reveal.isCorrect == null ? el('div', { class: 'verdict bad' }, 'No answer')
      : reveal.isPending ? el('div', { class: 'verdict' }, '? The host is checking')
      : el('div', { class: `verdict ${reveal.isCorrect ? 'good' : 'bad'}` }, reveal.isCorrect ? '✓ Correct' : '✗ Wrong', el('span', { class: 'points' }, pointsLabel(reveal.points)));
    return done(show(topBar(), el('div', { class: 'card' },
      verdict,
      next.myAnswer != null && el('span', { class: 'muted' }, `Your answer: ${next.myAnswer || '—'}`),
      el('p', { class: 'answer' }, reveal.answer),
      reveal.acceptedAnswers && el('span', {}, el('span', { class: 'muted' }, 'Also accepted: '), reveal.acceptedAnswers),
      reveal.comment && el('p', { class: 'pre muted', style: 'margin:0;font-size:14px' }, reveal.comment),
      reveal.hasAnswerImage && el('img', { class: 'handout', src: imageUrl('/answer-image'), alt: 'Answer' })),
      el('p', { class: 'muted', style: 'margin:0' }, `Your score: ${next.me.score} · place ${next.me.rank} of ${next.playerCount}`),
      leaderboard(next.leaderboard), skipDock()));
  }
  if (next.phase === 'finished') {
    return show(el('div', { class: 'center', style: 'flex:0;padding-top:24px' },
      el('h1', {}, `Round ${next.round} results`),
      el('p', { class: 'muted' }, `This round ${pointsLabel(next.me.roundScore)} · total ${next.me.score} · place ${next.me.rank} of ${next.playerCount}`)),
      leaderboard(next.leaderboard),
      el('p', { class: 'muted', style: 'text-align:center' }, 'Waiting for the host…'));
  }
}

setInterval(() => {
  if (!timerElement || !timerElement.isConnected) return;
  if (state?.isPaused && state.remainingMs != null) return (timerElement.textContent = `Paused ${clock(state.remainingMs)}`);
  if (deadline == null) {
    timerElement.textContent = '';
    timeFillElement.style.transform = 'scaleX(0)';
    return;
  }
  const left = Math.max(0, deadline - Date.now());
  const isLow = left <= 10000 && state.phase === 'question';
  timerElement.textContent = clock(left);
  timerElement.classList.toggle('low', isLow);
  timeFillElement.classList.toggle('low', isLow);
  timeFillElement.style.transform = `scaleX(${phaseSeconds() ? Math.min(1, left / (phaseSeconds() * 1000)) : 0})`;
}, 200);

if (session?.token) connect();
else showJoin();
</script>
</body>
</html>
