<body>
<main id="app"></main>
<script>
const app = document.getElementById('app');
const STORAGE_KEY = 'party-player';
let session = readSession();
let events = null;
let state = null;
let deadline = null;
let renderedScreen = null;
let timerElement = null;
let retryTimer = null;
let lastHeardAt = Date.now();
const SILENCE_BEFORE_RECONNECT_MS = 50000;
const banner = el('div', { class: 'banner', hidden: true }, el('span', { class: 'dot-pulse' }), 'Reconnecting…');
document.body.append(banner);

function readSession() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch {
    return null;
  }
}

function saveSession(value) {
  session = value;
  try {
    if (value) localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    else localStorage.removeItem(STORAGE_KEY);
  } catch {}
}

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node[key] = value;
  }
  for (const child of children.flat()) if (child != null && child !== false) node.append(child);
  return node;
}

const withLineBreaks = text => (text ?? '').replaceAll('/-/', '\n');
const clock = ms => {
  const seconds = Math.ceil(ms / 1000);
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
};
const ORDINALS = { 1: '1st', 2: '2nd', 3: '3rd' };
const ordinal = place => ORDINALS[place] ?? `${place}th`;
const MEDALS = { 1: '🥇', 2: '🥈', 3: '🥉' };
const CONGRATULATIONS = {
  1: { badge: '🏆', title: 'Congratulations, champion!', text: 'You won the round. Take a bow!' },
  2: { badge: '🥈', title: 'Great game!', text: 'So close to the top. Silver is yours.' },
  3: { badge: '🥉', title: 'Well done!', text: 'You made the podium with bronze.' },

function connect() {
  clearTimeout(retryTimer);
  events?.close();
  lastHeardAt = Date.now();
  events = new EventSource(`/events?token=${encodeURIComponent(session.token)}`);
  events.onopen = () => { banner.hidden = true; };
  events.onmessage = message => {
    lastHeardAt = Date.now();
    banner.hidden = true;
    render(JSON.parse(message.data));
  };
  events.addEventListener('ping', () => { lastHeardAt = Date.now(); });
  events.addEventListener('reaction', message => {
    lastHeardAt = Date.now();
    showOthersReaction(JSON.parse(message.data));
  });
  events.onerror = () => {
    if (renderedScreen === 'closed' || renderedScreen === 'join') return;
    banner.hidden = false;
    if (events.readyState === EventSource.CLOSED) checkSession();
  };
}

async function checkSession() {
  clearTimeout(retryTimer);
  events?.close();
  if (!session?.token) return showJoin();
  try {
    const response = await fetch(`/me?token=${encodeURIComponent(session.token)}`, { cache: 'no-store' });
    if (response.status === 401) {
      const previousName = session.name;
      saveSession(null);
      return showJoin('', { previousName, note: 'You are no longer in this game. Type your name to join again.' });
    }
    if (response.ok) {
      const body = await response.json();
      saveSession({ ...session, name: body.name });
      return connect();
    }
  } catch {}
  banner.hidden = false;
  retryTimer = setTimeout(checkSession, 3000);
}

function reconnectIfDead() {
  if (!session?.token || renderedScreen === 'closed' || renderedScreen === 'join') return;
  const isSilent = Date.now() - lastHeardAt > SILENCE_BEFORE_RECONNECT_MS;
  if (!events || events.readyState === EventSource.CLOSED || isSilent) checkSession();
}

let audio = null;

function unlockSound() {
  try {
    audio ??= new (window.AudioContext || window.webkitAudioContext)();

  } catch {}
}

function playChime() {
  if (!audio || audio.state !== 'running') return;
  const start = audio.currentTime;
  [[880, 0], [1320, 0.14]].forEach(([frequency, delay]) => {
    const tone = audio.createOscillator();
    const volume = audio.createGain();
    tone.type = 'sine';
    tone.frequency.value = frequency;
    volume.gain.setValueAtTime(0.0001, start + delay);
    volume.gain.exponentialRampToValueAtTime(0.25, start + delay + 0.02);
    volume.gain.exponentialRampToValueAtTime(0.0001, start + delay + 0.35);
    tone.connect(volume).connect(audio.destination);
    tone.start(start + delay);
    tone.stop(start + delay + 0.4);
  });
}

    sessionStorage.setItem(DISMISSED_KEY, shownAnnouncementId);
  } catch {}

function updateAnnouncement() {
  const announcement = state?.announcement;

  if (header) header.after(notice);

  if (announcement.id === shownAnnouncementId && !notice.hidden) return;
  const isNew = announcement.id !== shownAnnouncementId;

  notice.classList.toggle('is-new', isNew);

  tray?.classList.add('cooling');
  setTimeout(() => tray?.classList.remove('cooling'), REACTION_COOLDOWN_MS);
  flyFrom(button, emoji);
  navigator.vibrate?.(15);
  try {
    const response = await fetch('/react', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: session.token, emoji }) });

  const composerEmojis = document.getElementById('composer-emojis');
  if (composerEmojis) composerEmojis.hidden = !hasReactions;

    toggle.classList.toggle('on', isReactionTrayOpen);

  const header = app.querySelector('header');
  const existing = document.getElementById('reaction-tray');

function holdToSkip(button) {
  let timer = null;
  const stop = () => {
    clearTimeout(timer);
    timer = null;
    button.classList.remove('holding');
  };
  const start = () => {
    if (timer || button.disabled) return;
    button.classList.add('holding');
    timer = setTimeout(() => {
      stop();
      navigator.vibrate?.(30);
      toggleSkip();
    }, SKIP_HOLD_MS);
  };
  const release = () => {
    if (!timer) return;
    stop();
    showReactionToast(el('span', {}, holdHint()));
  };
  button.addEventListener('pointerdown', event => event.button === 0 && start());
  button.addEventListener('pointerup', release);
  button.addEventListener('pointerleave', stop);
  button.addEventListener('pointercancel', stop);
  button.addEventListener('contextmenu', event => event.preventDefault());
  button.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    if (!event.repeat) start();
  });
  button.addEventListener('keyup', event => (event.key === 'Enter' || event.key === ' ') && release());
  return button;
}

const SKIP_TITLES = { waiting: 'Start the question', question: "I'm done", reveal: 'Next' };
const MAX_SKIP_SEGMENTS = 12;

function skipDock() {
  return el('div', { class: 'dock', id: 'skip-dock' },
    holdToSkip(el('button', { type: 'button', class: 'skip hold', id: 'skip-button' },
      el('span', { class: 'skip-main' },
        holdRing(el('span', { class: 'skip-icon', id: 'skip-icon' })),
        el('span', { class: 'skip-text' }, el('span', { class: 'skip-title', id: 'skip-title' }), el('span', { class: 'skip-hint', id: 'skip-hint' })),
        el('span', { class: 'skip-count', id: 'skip-count' })),
      el('span', { class: 'skip-segments', id: 'skip-segments' }))));
}

function skipChip() {
  return holdToSkip(el('button', { type: 'button', class: 'skip-chip hold', id: 'skip-chip' },
    holdRing(el('span', { class: 'chip-icon', id: 'skip-chip-icon' })), 'Done', el('span', { class: 'count', id: 'skip-chip-count' })));
}

function updateSkipChip() {
  const chip = document.getElementById('skip-chip');
  if (!chip) return;
  const skip = state.skip;
  chip.hidden = !skip?.isAvailable;
  if (chip.hidden) return;
  chip.classList.toggle('on', !!skip.isMine);
  chip.title = skip.isMine ? 'Hold to take it back' : 'Hold to skip. Moves on when everyone is done';
  document.getElementById('skip-chip-icon').replaceChildren(icon(skip.isMine ? ICONS.check : ICONS.skip));
  document.getElementById('skip-chip-count').textContent = `${skip.count}/${skip.of}`;
}

function updateSkip() {
  updateSkipChip();
  const dock = document.getElementById('skip-dock');
  if (!dock) return;
  const skip = state.skip;
  dock.hidden = !skip?.isAvailable && !skip?.isHostChecking;
  if (dock.hidden) return;
  const button = document.getElementById('skip-button');
  button.disabled = !skip.isAvailable;
  if (!skip.isAvailable) {
    button.classList.remove('on');
    document.getElementById('skip-icon').replaceChildren(icon(ICONS.hourglass));
    document.getElementById('skip-title').textContent = 'The host is checking answers';
    document.getElementById('skip-hint').textContent = 'Only the host can move on now';
    document.getElementById('skip-count').textContent = '';
    document.getElementById('skip-segments').replaceChildren();
    return;
  }
  const others = skip.of - skip.count;
  button.classList.toggle('on', !!skip.isMine);
  document.getElementById('skip-icon').replaceChildren(icon(skip.isMine ? ICONS.check : ICONS.skip));
  document.getElementById('skip-title').textContent = skip.isMine ? `Waiting for ${others} ${others === 1 ? 'player' : 'players'}` : SKIP_TITLES[state.phase];
  document.getElementById('skip-hint').textContent = skip.isMine ? 'Hold to take it back' : 'Hold to skip · moves on when everyone skips';
  document.getElementById('skip-count').textContent = `${skip.count}/${skip.of}`;
  const segmentCount = Math.min(skip.of, MAX_SKIP_SEGMENTS);
  const filled = Math.round((skip.count / Math.max(skip.of, 1)) * segmentCount);
  document.getElementById('skip-segments').replaceChildren(...Array.from({ length: segmentCount }, (_, i) => el('i', { class: i < filled ? 'on' : '' })));
}

function leaderboard(entries) {
  return el('ol', { class: 'board' }, entries.map(entry => el('li', { class: entry.name === state.me.name ? 'me' : '' },
    el('span', { class: 'rank' }, MEDALS[entry.rank] ? el('span', { class: 'emoji' }, MEDALS[entry.rank]) : `${entry.rank}.`), el('span', { class: 'name' }, entry.name),
    entry.avgSeconds != null && el('span', { class: 'time', title: 'Average time of correct answers' }, secondsLabel(entry.avgSeconds)),
    el('span', { class: 'score' }, entry.score))));
}

let timeFillElement = null;

function topBar() {
  timerElement = el('span', { class: 'timer' });
  timeFillElement = el('div', { class: 'time-fill' });
  return el('header', {},
    el('div', { class: 'bar' },
      el('span', { class: 'pill' }, el('span', { class: 'label' }, 'Q'), `${state.index + 1}/${state.total}`),
      nameButton(),
      el('span', { class: 'pill', title: 'Your score' }, state.me.score, el('span', { class: 'label' }, state.me.score === 1 ? 'pt' : 'pts')),
      el('button', { type: 'button', class: 'pill react-toggle', id: 'react-toggle', title: 'Reactions', onclick: toggleReactionTray }, icon(ICONS.smile)),
      el('span', { class: 'spacer' }),
      timerElement),
    el('div', { class: 'time-track' }, timeFillElement));
}

const phaseSeconds = () => ({ waiting: state.rules.secondsBetweenQuestions, question: state.rules.secondsPerQuestion, reveal: state.rules.secondsOnAnswer })[state.phase];

let mediaNodes = new Map();

function media(src, kind, alt) {
  if (kind !== 'video' && kind !== 'audio') return el('img', { class: 'handout', src, alt });
  if (!mediaNodes.has(src)) {
    mediaNodes.forEach(node => node.pause());
    mediaNodes = new Map([[src, el(kind, { class: `handout ${kind}`, src, controls: true, preload: 'metadata', playsInline: true })]]);
  }
  return mediaNodes.get(src);
}

function questionBlock() {
  const question = state.question;
  return [
    question.noteBefore && el('div', { class: 'note' }, question.noteBefore),
    el('p', { class: 'question' }, withLineBreaks(question.text)),
    question.hasHandoutImage && media(imageUrl('/handout'), question.handoutKind, 'Handout'),
    question.handoutText && el('p', { class: 'pre' }, question.handoutText),
  ];
}

function composerDock() {
  const input = el('input', { class: 'composer-input', placeholder: 'Your answer', maxLength: 200, autocomplete: 'off', autocapitalize: 'off', spellcheck: false, enterKeyHint: 'send', value: state.myAnswer ?? '' });
  const status = el('span', { class: 'sent composer-status', id: 'answer-status' });
  const button = el('button', { type: 'submit', class: 'composer-send', title: 'Send answer' }, icon(ICONS.arrow));
  const send = async event => {
    event.preventDefault();
    button.disabled = true;
    try {
      const response = await fetch('/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: session.token, answer: input.value }) });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error);
      input.blur();
    } catch (e) {
      status.classList.add('error-text');
      status.textContent = e.message || 'Could not send';
    }
    button.disabled = false;
  };
  const emojis = el('div', { class: 'composer-emojis', id: 'composer-emojis', role: 'group', title: 'Reactions: everyone sees them' },
    state.reactions.map(emoji => el('button', { type: 'button', title: `Send ${emoji}`, onclick: event => sendReaction(event.currentTarget, emoji) }, emoji)));
  return el('div', { class: 'composer-dock', id: 'composer-dock' },
    emojis,
    el('form', { class: 'composer', onsubmit: send }, input, button),
    el('div', { class: 'composer-meta' }, status, skipChip()));
}

function updateAnswerStatus() {
  const status = document.getElementById('answer-status');
  if (!status) return;
  status.classList.remove('error-text');
  if (state.myAnswer == null) return status.replaceChildren(el('span', { class: 'muted' }, 'Not sent yet'));
  status.replaceChildren(icon(ICONS.check), 'Sent · you can change it');
}

function render(next) {
  renderScreen(next);
  if (renderedScreen === 'join' || renderedScreen === 'closed') return (notice.hidden = true);
  updateAnnouncement();
  updateReactions();
}

function renderScreen(next) {
  state = next;
  if ('isNightMode' in next) document.documentElement.dataset.theme = next.isNightMode ? 'dark' : 'light';
  deadline = next.remainingMs == null || next.isPaused ? null : Date.now() + next.remainingMs;
  if (next.phase === 'moved') {
    events.close();
    const previousName = session?.name;
    saveSession(null);
    return showJoin('', { previousName, note: 'You joined with this name on another device. Type your name to play here again.' });
  }
  if (next.phase === 'kicked') {
    events.close();
    const previousName = session?.name;
    saveSession(null);
    return showJoin('', { previousName, note: 'The host removed you from the game. Type your name to join again.' });
  }
  if (next.phase === 'closed') {
    renderedScreen = 'closed';
    events.close();
    saveSession(null);
    return show(el('div', { class: 'center' },
      el('h1', {}, 'The host closed the game'),
      el('p', { class: 'muted' }, 'Thanks for playing!')));
  }
  if (session && next.me && session.name !== next.me.name) saveSession({ ...session, name: next.me.name });
  const screen = `${next.phase}:${next.index}`;
  if (screen === renderedScreen && next.phase === 'question') {
    const nameElement = document.getElementById('me-name');
    if (nameElement) nameElement.textContent = next.me.name;
    updateSkip();
    return updateAnswerStatus();
  }
  if (next.phase === 'question' && renderedScreen !== screen) alertQuestionStart();
  renderedScreen = screen;
  const done = rendered => {
    updateSkip();
    return rendered;
  };
  if (next.phase === 'lobby' && next.round > 0) {
    return show(el('div', { class: 'center', style: 'flex:0;padding-top:24px' },
      el('h1', {}, `Round ${next.round} is over`),
      el('p', { class: 'muted' }, `Your score: ${next.me.score} · place ${next.me.rank} of ${next.playerCount}. Waiting for the next round…`),
      el('div', { style: 'margin-top:8px' }, settingsButton())),
      leaderboard(next.leaderboard), el('div', { class: 'reactions-slot' }));
  }
  if (next.phase === 'lobby') {
    return show(el('div', { class: 'center' },
      el('h1', {}, `You're in, ${next.me.name}!`),
      el('p', { class: 'muted' }, `Waiting for the host to start… ${next.playerCount} ${next.playerCount === 1 ? 'player' : 'players'} joined.`),
      el('div', { style: 'margin-top:8px' }, settingsButton())), el('div', { class: 'reactions-slot' }));
  }
  if (next.phase === 'waiting') {
    return done(show(topBar(), el('div', { class: 'center' },
      el('p', { class: 'muted' }, 'Question'), el('div', { class: 'big-number' }, next.index + 1), el('p', { class: 'muted' }, `of ${next.total}`)), skipDock()));
  }
  if (next.phase === 'question') {
    isAway = false;
    if (document.visibilityState === 'hidden') reportAway();
    show(topBar(), questionBlock(), el('p', { class: 'muted', style: 'margin:0;font-size:14px' }, rulesText()), composerDock());
    updateSkip();
    return updateAnswerStatus();
  }
  if (next.phase === 'judging') {
    return show(topBar(), questionBlock(), el('div', { class: 'card' },
      el('strong', {}, "Time's up! Checking answers…"),
      el('span', { class: 'muted' }, `Your answer: ${next.myAnswer || '—'}`)));
  }
  if (next.phase === 'reveal') {
    const reveal = next.reveal;
    const verdict = reveal.isCorrect == null ? el('div', { class: 'verdict bad' }, 'No answer')
      : reveal.isPending ? el('div', { class: 'verdict' }, '? The host is checking')
      : el('div', { class: `verdict ${reveal.isCorrect ? 'good' : 'bad'}` }, reveal.isCorrect ? '✓ Correct' : '✗ Wrong', el('span', { class: 'points' }, pointsLabel(reveal.points)));
    return done(show(topBar(), el('div', { class: 'card' },
      verdict,
      next.myAnswer != null && el('span', { class: 'muted' }, `Your answer: ${next.myAnswer || '—'}`),
      reveal.seconds != null && el('span', { class: 'time-note' }, icon(ICONS.clock), `Answered in ${secondsLabel(reveal.seconds)}`),
      el('p', { class: 'answer' }, reveal.answer),
      reveal.acceptedAnswers && el('span', {}, el('span', { class: 'muted' }, 'Also accepted: '), reveal.acceptedAnswers),
      reveal.comment && el('p', { class: 'pre muted', style: 'margin:0;font-size:14px' }, reveal.comment),
      reveal.hasAnswerImage && media(imageUrl('/answer-image'), reveal.answerKind, 'Answer')),
      el('p', { class: 'muted', style: 'margin:0' }, `Your score: ${next.me.score} · place ${next.me.rank} of ${next.playerCount}`),
      leaderboard(next.leaderboard), skipDock()));
  }
  if (next.phase === 'finished') {
    const place = next.me.rank;
    const winners = next.leaderboard.filter(entry => entry.rank === 1).map(entry => entry.name);
    const congratulation = CONGRATULATIONS[Math.min(place, 4)];
    const title = place === 1 && winners.length > 1 ? 'You share first place!' : congratulation.title;
    const celebrationKey = `${next.partyId}:${next.round}`;
    if (place <= 3 && celebratedRound !== celebrationKey) {
      celebratedRound = celebrationKey;
      celebrate(place === 1 ? 140 : 60);
      navigator.vibrate?.(place === 1 ? [120, 80, 120, 80, 300] : [120, 80, 120]);
    }
    return show(el('div', { class: `congrats place-${Math.min(place, 4)}` },
      el('div', { class: 'congrats-badge' }, congratulation.badge),
      el('div', { class: 'congrats-kicker', lang: 'en' }, place <= 3 ? `${ORDINALS[place]} place · round ${next.round}` : `Round ${next.round} results`),
      el('h1', { class: 'congrats-title' }, place > 3 ? `You finished ${ordinal(place)} of ${next.playerCount}` : title),
      el('p', { class: 'congrats-text' }, place === 1 ? congratulation.text : place <= 3 ? congratulation.text : `Thanks for playing! 🏆 ${winners.join(', ')} won this round.`),
      el('div', { class: 'congrats-facts' },
        el('span', { class: 'pill' }, el('span', { class: 'label' }, 'Round'), pointsLabel(next.me.roundScore)),
        el('span', { class: 'pill' }, el('span', { class: 'label' }, 'Total'), next.me.score),
        next.me.avgSeconds != null && el('span', { class: 'pill' }, el('span', { class: 'label' }, 'Avg'), secondsLabel(next.me.avgSeconds)))),
      leaderboard(next.leaderboard),
      el('div', { class: 'reactions-slot' }),
      el('p', { class: 'muted', style: 'text-align:center' }, 'Waiting for the host…'));
  }
}

setInterval(() => {
  if (!timerElement || !timerElement.isConnected) return;
  if (state?.isPaused && state.remainingMs != null) return (timerElement.textContent = `Paused ${clock(state.remainingMs)}`);
  if (deadline == null) {
    timerElement.textContent = '';
    timeFillElement.style.transform = 'scaleX(0)';
    return;
  }
  const left = Math.max(0, deadline - Date.now());
  const isLow = left <= 10000 && state.phase === 'question';
  timerElement.textContent = clock(left);
  timerElement.classList.toggle('low', isLow);
  timeFillElement.classList.toggle('low', isLow);
  timeFillElement.style.transform = `scaleX(${phaseSeconds() ? Math.min(1, left / (phaseSeconds() * 1000)) : 0})`;
}, 200);

if (session?.token) connect();
else showJoin();
</script>
</body>
</html>
